<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>ALO — HD ভিডিও কল ও চ্যাট</title>
<meta name="description" content="ALO: ফ্রি HD ভিডিও কল, ভয়েস কল, রিয়েল-টাইম চ্যাট ও কল রেকর্ডিং।">
<meta name="theme-color" content="#0084FF">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Noto+Sans+Bengali:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root { --alo:#0084FF; }
  .hidden { display:none; } /* fallback if the Tailwind CDN is slow to load */
  body { font-family:'Inter','Noto Sans Bengali',sans-serif; }
  .font-mono { font-family:'JetBrains Mono',monospace; }
  .mirror { transform:scaleX(-1); }
  .msg-text { white-space:pre-wrap; word-break:break-word; user-select:text; -webkit-user-select:text; }
  @keyframes pulseSlow { 0%,100%{transform:scale(1);opacity:1} 50%{transform:scale(1.04);opacity:.85} }
  .pulse-slow { animation:pulseSlow 2.4s infinite ease-in-out; }
  @keyframes ringWave { 0%{transform:scale(1);opacity:.5} 100%{transform:scale(1.9);opacity:0} }
  .ring-wave::before,.ring-wave::after { content:''; position:absolute; inset:0; border-radius:9999px; border:2px solid rgba(0,132,255,.6); animation:ringWave 2s infinite; }
  .ring-wave::after { animation-delay:1s; }
  @keyframes floatUp { 0%{transform:translateY(0) scale(.6);opacity:0} 15%{opacity:1;transform:translateY(-30px) scale(1.2)} 100%{transform:translateY(-320px) scale(1);opacity:0} }
  .float-emoji { position:absolute; bottom:150px; font-size:44px; animation:floatUp 2.6s ease-out forwards; pointer-events:none; }
  @keyframes pop { from{transform:scale(.94);opacity:0} to{transform:scale(1);opacity:1} }
  .pop { animation:pop .15s ease-out; }
  @keyframes blink { 50%{opacity:.2} }
  .blink { animation:blink 1.2s infinite; }
  .safe-b { padding-bottom:max(.75rem, env(safe-area-inset-bottom)); }
  ::-webkit-scrollbar { width:6px } ::-webkit-scrollbar-thumb { background:#cbd5e1; border-radius:9px }
  input,textarea,select { font-family:inherit }
  .dock-btn { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; border-radius:1rem; background:rgba(255,255,255,.1); transition:background .15s, transform .1s; }
  .dock-btn:active { transform:scale(.94) }
  .dock-btn.on { background:#fff; color:#0f172a }
  .dock-btn.bad { background:#f43f5e }
  .dock-btn span.l { font-size:9px; line-height:1.1 }
  .filter-chip.on { outline:2px solid var(--alo) }
</style>
</head>
<body class="bg-slate-100 text-slate-900 antialiased overflow-hidden">
<div id="app" class="h-[100dvh] w-full"></div>
<div id="toasts" class="fixed top-3 left-1/2 -translate-x-1/2 z-[100] flex flex-col gap-2 items-center pointer-events-none w-full px-3"></div>
<div id="modal" class="hidden fixed inset-0 z-[60] bg-black/60 backdrop-blur-sm flex items-center justify-center p-4"></div>

<!-- ============ Incoming call overlay ============ -->
<div id="incoming" class="hidden fixed inset-0 z-[70] bg-slate-950/95 text-white flex flex-col items-center justify-between py-16 px-6">
  <div class="text-center">
    <p id="inKind" class="text-sm text-slate-300 mb-8"></p>
    <div class="relative w-36 h-36 mx-auto ring-wave"><div id="inAvatar" class="relative w-36 h-36 rounded-full overflow-hidden"></div></div>
    <h2 id="inName" class="mt-8 text-2xl font-extrabold"></h2>
    <p id="inPhone" class="text-sm text-slate-400 font-mono mt-1"></p>
  </div>
  <div class="flex items-center justify-center gap-16">
    <button id="inDecline" class="flex flex-col items-center gap-2"><span class="w-16 h-16 rounded-full bg-rose-600 flex items-center justify-center shadow-lg shadow-rose-600/40"><span data-i="phoneOff" data-c="w-7 h-7"></span></span><span class="text-xs" data-t="decline"></span></button>
    <button id="inAccept" class="flex flex-col items-center gap-2"><span class="w-16 h-16 rounded-full bg-emerald-500 flex items-center justify-center shadow-lg shadow-emerald-500/40 pulse-slow"><span data-i="phone" data-c="w-7 h-7"></span></span><span class="text-xs" data-t="accept"></span></button>
  </div>
</div>

<!-- ============ In-call screen ============ -->
<div id="callUI" class="hidden fixed inset-0 z-[65] bg-slate-950 text-white overflow-hidden">
  <video id="rv" autoplay playsinline class="absolute inset-0 w-full h-full object-cover bg-black"></video>
  <div id="rvOff" class="absolute inset-0 flex flex-col items-center justify-center bg-gradient-to-b from-slate-900 to-slate-950">
    <div id="callAvatar" class="w-44 h-44 rounded-full overflow-hidden border-4 border-white/20 shadow-2xl pulse-slow"></div>
    <p id="remoteMutedTag" class="hidden mt-4 text-xs bg-white/10 rounded-full px-3 py-1"></p>
  </div>
  <div class="absolute top-0 inset-x-0 p-4 pt-[max(1rem,env(safe-area-inset-top))] flex items-center justify-between bg-gradient-to-b from-black/80 to-transparent z-10">
    <div class="flex items-center gap-3 min-w-0">
      <div id="callAvatarSm" class="w-10 h-10 rounded-full overflow-hidden shrink-0"></div>
      <div class="min-w-0">
        <h3 class="font-bold text-sm flex items-center gap-1.5"><span id="callName" class="truncate"></span><span class="text-[10px] bg-blue-500/30 text-sky-300 px-1.5 py-0.5 rounded font-mono">HD</span></h3>
        <p id="callStatus" class="text-xs text-slate-300 font-mono"></p>
      </div>
    </div>
    <div class="flex flex-col items-end gap-1">
      <span id="recBadge" class="hidden text-[11px] bg-rose-600 rounded-full px-2.5 py-1 flex items-center gap-1.5 font-semibold"><span class="w-2 h-2 rounded-full bg-white blink"></span><span id="recTime">REC</span></span>
      <span id="peerRec" class="hidden text-[11px] bg-amber-500/90 text-black rounded-full px-2.5 py-1 font-semibold"></span>
    </div>
  </div>
  <video id="lv" autoplay muted playsinline class="hidden absolute right-3 top-20 w-28 h-40 sm:w-36 sm:h-48 rounded-2xl object-cover border border-white/30 shadow-xl z-10 bg-slate-800"></video>
  <div id="reactLayer" class="absolute inset-0 pointer-events-none z-20 overflow-hidden"></div>

  <!-- in-call chat -->
  <div id="callChat" class="hidden absolute z-30 inset-x-3 bottom-44 max-w-sm sm:left-auto sm:right-3 bg-slate-900/95 backdrop-blur-xl border border-white/10 rounded-2xl flex flex-col h-72 pop">
    <div class="px-3 py-2 border-b border-white/10 flex items-center justify-between text-xs font-bold"><span data-t="chat"></span><button id="ccClose"><span data-i="x" data-c="w-4 h-4"></span></button></div>
    <div id="ccMsgs" class="flex-1 overflow-y-auto p-2 space-y-1.5 text-xs"></div>
    <form id="ccForm" class="p-2 flex gap-2 border-t border-white/10"><input id="ccInput" autocomplete="off" class="flex-1 bg-white/10 rounded-full px-3 py-2 text-xs outline-none placeholder-slate-400" data-ph="typeMsg"><button class="w-9 h-9 rounded-full bg-[#0084FF] flex items-center justify-center"><span data-i="send" data-c="w-4 h-4"></span></button></form>
  </div>
  <!-- filter panel -->
  <div id="filterPanel" class="hidden absolute z-30 inset-x-3 bottom-44 max-w-sm mx-auto bg-slate-900/95 backdrop-blur-xl border border-white/10 rounded-2xl p-3 pop">
    <div id="filterList" class="flex gap-2 overflow-x-auto pb-1"></div>
  </div>
  <!-- reaction panel -->
  <div id="reactPanel" class="hidden absolute z-30 inset-x-3 bottom-44 max-w-sm mx-auto bg-slate-900/95 backdrop-blur-xl border border-white/10 rounded-2xl p-3 flex justify-around text-3xl pop"></div>

  <div class="absolute bottom-0 inset-x-0 p-3 pb-6 z-20 flex justify-center bg-gradient-to-t from-black/95 to-transparent">
    <div class="w-full max-w-sm bg-slate-900/95 backdrop-blur-2xl p-2.5 rounded-3xl border border-white/15 shadow-2xl flex flex-col gap-2">
      <div class="flex items-stretch justify-between gap-1 px-1">
        <button id="bChat" class="dock-btn py-2 relative"><span data-i="message" data-c="w-4 h-4"></span><span class="l" data-t="chat"></span><i id="chatDot" class="hidden absolute top-1 right-3 w-2 h-2 rounded-full bg-rose-500"></i></button>
        <button id="bFilter" class="dock-btn py-2"><span data-i="sparkles" data-c="w-4 h-4"></span><span class="l" data-t="filters"></span></button>
        <button id="bReact" class="dock-btn py-2"><span data-i="smile" data-c="w-4 h-4"></span><span class="l" data-t="react"></span></button>
        <button id="bShare" class="dock-btn py-2"><span data-i="monitor" data-c="w-4 h-4"></span><span class="l" data-t="share"></span></button>
        <button id="bRec" class="dock-btn py-2 text-rose-300"><span id="bRecIcon" data-i="disc" data-c="w-4 h-4 text-rose-400"></span><span class="l" id="bRecL" data-t="record"></span></button>
      </div>
      <div class="flex items-stretch justify-between gap-1.5 pt-1.5 border-t border-white/10 px-1">
        <button id="bMic" class="dock-btn py-2.5"><span id="bMicIcon" data-i="mic" data-c="w-5 h-5 text-emerald-400"></span><span class="l" data-t="mic"></span></button>
        <button id="bSpk" class="dock-btn py-2.5"><span id="bSpkIcon" data-i="volume" data-c="w-5 h-5"></span><span class="l" data-t="speaker"></span></button>
        <button id="bFlip" class="dock-btn py-2.5"><span data-i="switchCamera" data-c="w-5 h-5"></span><span class="l" data-t="flip"></span></button>
        <button id="bVid" class="dock-btn py-2.5"><span id="bVidIcon" data-i="video" data-c="w-5 h-5 text-sky-400"></span><span class="l" data-t="video"></span></button>
        <button id="bEnd" class="dock-btn py-2.5 !bg-rose-600 hover:!bg-rose-700 shadow-lg shadow-rose-600/40"><span data-i="phoneOff" data-c="w-5 h-5"></span><span class="l uppercase font-black" data-t="end"></span></button>
      </div>
    </div>
  </div>
</div>

function dayLabel(ts) {

async function api(path, method = 'GET', body) {

  let j = {}; try { j = await r.json(); } catch {}
  if (r.status === 401 && S.token && !path.startsWith('/login') && !path.startsWith('/register')) { forceLogout(); }
  if (!r.ok) throw Object.assign(new Error(j.error || 'error'), { code: j.error, status: r.status });

}

/* ------------------------------------------------------------ boot */
async function boot() {
  if (!S.token) return showAuth('login');
  try {
    const d = await api('/bootstrap');
    S.me = d.me; S.contacts = new Map(d.contacts.map((c) => [c.id, c])); S.conv = d.conversations; S.calls = d.calls; S.ice = d.ice || S.ice;
    S.msgs = {}; S.active = null; S.tab = 'chats';
  } catch (e) { if (e.status === 401) return; toast(errMsg(e)); return setTimeout(boot, 2500); }
  renderShell(); connectSSE(); renderList(); renderChat();
  if ('Notification' in window && Notification.permission === 'default') document.addEventListener('click', () => Notification.requestPermission(), { once: true });
}
function teardownApp() { if (S.es) { S.es.close(); S.es = null; } }

/* ------------------------------------------------------------- SSE */
function connectSSE() {
  teardownApp(); S.reconnected = false;
  const es = new EventSource('/api/events?token=' + encodeURIComponent(S.token));
  S.es = es;
  es.addEventListener('ready', () => { if (S.reconnected) resync(); S.reconnected = true; });
  es.addEventListener('message', (e) => onMessage(JSON.parse(e.data)));
  es.addEventListener('msg-status', (e) => onMsgStatus(JSON.parse(e.data)));
  es.addEventListener('presence', (e) => { const d = JSON.parse(e.data), c = S.contacts.get(d.id); if (c) { c.online = d.online; c.lastSeen = d.lastSeen; renderList(); renderChatHeader(); } });
  es.addEventListener('profile', (e) => { const u = JSON.parse(e.data); if (u.id === S.me.id) { S.me = u; renderShell(true); } else if (S.contacts.has(u.id)) S.contacts.set(u.id, u); renderList(); renderChatHeader(); });
  es.addEventListener('contact', (e) => { const u = JSON.parse(e.data); S.contacts.set(u.id, u); renderList(); });
  es.addEventListener('typing', (e) => { const { from } = JSON.parse(e.data); S.typing[from] = Date.now(); renderTyping(); setTimeout(renderTyping, 3200); renderList(); });
  es.addEventListener('read-sync', (e) => { const { with: w } = JSON.parse(e.data); if (S.conv[w]) { S.conv[w].unread = 0; renderList(); } });
  es.addEventListener('calllog', (e) => { const c = JSON.parse(e.data); const i = S.calls.findIndex((x) => x.id === c.id); if (i >= 0) S.calls[i] = c; else S.calls.unshift(c); if (S.tab === 'calls') renderList(); });
  es.addEventListener('signal', (e) => onSignal(JSON.parse(e.data)));
}

      return `<div class="py-3"><div class="flex items-center justify-between gap-2"><div class="min-w-0"><h4 class="text-sm font-bold truncate">${esc(r.peerName)}</h4><p class="text-[11px] text-slate-400">${new Date(r.timestamp).toLocaleString(locale())} · ${fmtDur(r.duration)} · ${(r.size / 1048576).toFixed(1)} MB</p></div>
        <div class="flex gap-1 shrink-0"><a href="${u}" download="ALO-${esc(r.peerName)}-${r.timestamp}.${r.mime.includes('mp4') ? 'mp4' : 'webm'}" class="p-2 rounded-full text-[#0084FF] hover:bg-blue-50" title="${t('download')}">${icon('download')}</a><button data-del="${r.id}" class="p-2 rounded-full text-rose-500 hover:bg-rose-50" title="${t('del')}">${icon('trash')}</button></div></div>
        ${r.kind === 'video' ? `<video src="${u}" controls playsinline class="w-full rounded-xl mt-2 bg-black max-h-56"></video>` : `<audio src="${u}" controls class="w-full mt-2"></audio>`}</div>`; }).join('') || `<p class="text-center text-sm text-slate-400 py-8">${t('noRec')}</p>`;
    $('recList').querySelectorAll('[data-del]').forEach((b) => (b.onclick = async () => { await deleteRecording(b.dataset.del); render(); }));
  };
  openModal(`<div class="bg-white rounded-3xl w-full max-w-md p-6 relative pop max-h-[88vh] flex flex-col"><button data-close class="absolute top-4 right-4 p-2 rounded-full bg-slate-100 hover:bg-slate-200">${icon('x')}</button><h3 class="font-extrabold text-lg mb-2 flex items-center gap-2 text-rose-600">${icon('disc')} ${t('recordings')}</h3><div id="recList" class="overflow-y-auto divide-y divide-slate-100"></div></div>`, () => urls.forEach(URL.revokeObjectURL));
  render();
}

/* ---- wire up call controls ---- */
$('inAccept').onclick = acceptCall; $('inDecline').onclick = declineCall;
$('bEnd').onclick = () => hangup(); $('bMic').onclick = toggleMic; $('bVid').onclick = toggleVideo; $('bFlip').onclick = flipCamera; $('bShare').onclick = toggleShare;
$('bSpk').onclick = () => { media.spkOn = !media.spkOn; applySpeaker(); };
$('bRec').onclick = () => (rec ? stopRecording() : startRecording());
$('bChat').onclick = () => togglePanel('callChat'); $('bFilter').onclick = () => togglePanel('filterPanel'); $('bReact').onclick = () => togglePanel('reactPanel'); $('ccClose').onclick = () => $('callChat').classList.add('hidden');
$('ccForm').onsubmit = (e) => { e.preventDefault(); const v = $('ccInput').value.trim(); if (v && call) { $('ccInput').value = ''; sendMessage(call.peer.id, v); } };
document.addEventListener('click', () => { if (actx && actx.state === 'suspended') actx.resume(); }, { capture: true });

/* ----------------------------------------------------------- go */
hydrate(); document.documentElement.lang = LANG;
if (S.token) boot(); else showAuth('login');
</script>
</body>
</html>
